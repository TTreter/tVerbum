[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tverbum"
version = "1.2.0"
description = "Motor facilitador para redação, validação cartorial e revisão assistida de atas plenárias via IA"
readme = "README.md"
authors = [
    { name = "Tiago" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "google-genai>=2.30.0",
    "youtube-transcript-api>=1.2.0",
    "yt-dlp>=2026.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-dotenv>=1.0.0",
    "python-docx>=1.0.0",
    "reportlab>=4.0.0",
    "num2words>=0.5.12"
]

[project.scripts]
tverbum = "tverbum.__main__:main"
