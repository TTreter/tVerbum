<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="sheet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="3" opacity="0.6"/>

  <!-- Document Paper Sheet -->
  <g filter="url(#shadow)">
    <path d="M 140 100 L 310 100 L 372 162 L 372 400 A 16 16 0 0 1 356 416 L 140 416 A 16 16 0 0 1 124 400 L 124 116 A 16 16 0 0 1 140 100 Z" fill="url(#sheet-grad)"/>
    <path d="M 310 100 L 310 152 A 10 10 0 0 0 320 162 L 372 162 Z" fill="#cbd5e1"/>
  </g>

  <!-- Document Lines representing official notary paragraphs -->
  <line x1="164" y1="184" x2="280" y2="184" stroke="#059669" stroke-width="8" stroke-linecap="round"/>
  <line x1="164" y1="218" x2="332" y2="218" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <line x1="164" y1="244" x2="332" y2="244" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <line x1="164" y1="270" x2="332" y2="270" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <line x1="164" y1="296" x2="300" y2="296" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <line x1="164" y1="322" x2="332" y2="322" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>

  <!-- Official Notary Gold Wax Stamp -->
  <circle cx="212" cy="368" r="24" fill="url(#accent-grad)" filter="url(#shadow)"/>
  <path d="M 205 368 L 210 374 L 220 362" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Fountain Pen / Quill with AI Glow -->
  <g transform="translate(300, 230) rotate(-38)" filter="url(#shadow)">
    <!-- Pen Body -->
    <path d="M 0 0 L 18 0 L 14 140 L 4 140 Z" fill="url(#primary-grad)"/>
    <path d="M 0 0 L 18 0 L 9 -35 Z" fill="#0f172a"/>
    <!-- Gold Band -->
    <rect x="-1" y="80" width="20" height="12" rx="2" fill="url(#accent-grad)"/>
    <!-- Nib -->
    <path d="M 4 140 L 14 140 L 9 175 Z" fill="url(#accent-grad)"/>
    <line x1="9" y1="140" x2="9" y2="168" stroke="#451a03" stroke-width="1.5"/>
    <circle cx="9" cy="154" r="2" fill="#451a03"/>
  </g>
</svg>
